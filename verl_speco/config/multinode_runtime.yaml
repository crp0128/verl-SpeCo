# Explicit opt-in, external services, arbitrary physical node/device counts.
speco:
  multinode_runtime:
    mode: standalone
    run_id: null
    generation: 1
    external_services: true
    topology:
      rollout_nodes: 1
      draft_nodes: 1
      nproc_per_draft_node: 1
      rollout_node_indices: [0]
      draft_node_indices: [1]
      target_tp: 1
      target_dp: 1
      draft_device_start: 0
      draft_tp: 1
      draft_pp: 1
      draft_sp: 1
      draft_ep: 1
      master_addr: null
      master_port: 29500
    ray:
      address: auto
      namespace: transfer_queue
      rollout_resource: speco_rollout
      draft_resource: speco_draft
      control_resource: speco_control
      rl_learner_resource: speco_rl_learner
    transfer_queue:
      partition: speco_drafter_features
      ready_shards: 1
      capacity_bytes: 4294967296
      high_watermark_ratio: 0.85
      low_watermark_ratio: 0.60
    execution:
      backend: external_ray
      trainer_engine: speco_fsdp2
      device: cuda
      vllm_endpoints: [http://127.0.0.1:8000/v1]
      worker_env: {}
      overrides: []
